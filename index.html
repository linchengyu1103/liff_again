	<style>
		button {
			display: none;
			width: 50%;
			height: 10%;
			padding: 16px 0;
			margin: auto 0;
		}
	</style>

<body>
	<button id="btnShare" onclick="sendShare_VoteAugRic()" style="display: none;margin: 20px auto;padding: 20px;">8月時間+瑞克早安</button>

	<button id="btnShare2" onclick="sendShare_VoteAugLal()" style="display: none;margin: 20px auto;padding: 20px;">8月時間+la送的</button>

	<button id="btnLogin" onclick="liff.login()" style="display: none;margin: 20px auto;padding: 20px;">Log In</button>
	<button id="btnLogOut" onclick="logOut()" style="display: none;margin: 20px auto;padding: 20px;">Log Out</button>
	<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
	<script>

			name = await liff.getProfile().then((profile) => {
				return profile.displayName;

				return err;
			});

            {

		//更改連結
    },
    "url": "https://raw.githubusercontent.com/linchengyu1103/liff_again/refs/heads/main/line%20vote.png" 
  },
  "body": {
    "type": "box",
    "layout": "vertical",
    "contents": [
      {
        "type": "text",
        "text": "[投票] 8月可以的時間", //改名稱
        "margin": "none",
        "size": "md",
        "weight": "bold",
        "style": "normal",
        "decoration": "none",
        "position": "relative",
        "align": "start",
        "gravity": "top",
        "scaling": true,
        "offsetTop": "none",
        "offsetBottom": "xxl",
        "offsetStart": "none",
        "offsetEnd": "sm"
      },
      {
        "type": "text",
        "text": "請前往投票頁面中投票",
        "margin": "lg",
        "size": "xs",
        "weight": "regular",
        "style": "normal",
        "color": "#5B5B5B"
      }
    ]
  },
  "footer": {
    "type": "box",
    "layout": "vertical",
    "spacing": "sm",
    "contents": [
      {
        "type": "button",
        "height": "md",
        "action": {
          "type": "uri",
          "label": "立即投票",
          "uri": "https://liff.line.me/2010318117-3e4BgLeQ?auto=yes&type=image&downloadUrl=https://raw.githubusercontent.com/linchengyu1103/image-storage/refs/heads/main/rickroll.jpg&previewUrl=https://raw.githubusercontent.com/linchengyu1103/image-storage/refs/heads/main/rickroll.jpg" 
			//更改連結
        },
        "position": "relative",
        "margin": "xl",
        "offsetTop": "none",
        "offsetBottom": "xl"
      },
      {
        "type": "separator",
        "margin": "lg"
      },
      {
        "type": "box",
        "layout": "baseline",
        "contents": [
          {
            "type": "icon",
            "url": "https://raw.githubusercontent.com/linchengyu1103/liff_again/refs/heads/main/%E6%8A%95%E7%A5%A8%E5%8B%BE.png",
            "margin": "sm",
            "offsetTop": "sm",
            "size": "xxs"
          },
          {
            "type": "text",
            "text": "投票",
            "size": "xxs",
            "margin": "md",
            "color": "#9D9D9D",
            "offsetTop": "xs"
          },
          {
            "type": "icon",
            "url": "https://i.imgur.com/aKbXQ9D.png",
            "size": "xxs",
            "margin": "none",
            "offsetTop": "sm"
          }
        ],
        "spacing": "none",
        "position": "relative",
        "cornerRadius": "none",
        "offsetTop": "none"
      }
    ],
    "flex": 0
  }
}
						}
])
			if (result) {
				alert(`[${result.status}] Message sent!`)
			} else {
				const [majorVer, minorVer, patchVer] = (liff.getLineVersion() || "").split('.');

				if (minorVer === undefined) {
					alert('ShareTargetPicker was canceled in external browser')
					return
				}

				if (parseInt(majorVer) >= 10 && parseInt(minorVer) >= 10 && parseInt(patchVer) > 0) {
					alert('ShareTargetPicker was canceled in LINE app')
				}
			}
		}

function logOut() {
			liff.logout()
			window.location.reload()
		}

		async function main() {
			await liff.init({ liffId: "2010318117-cu4KctEs" })
			if (liff.isLoggedIn()) {
				document.getElementById("btnShare").style.display = "block"
				document.getElementById("btnShare1").style.display = "block"
				document.getElementById("btnShare2").style.display = "block"
				// 可以新增按鈕的顯示
				if (!liff.isInClient()) {
					document.getElementById("btnLogOut").style.display = "block"
				}
			} else {
				document.getElementById("btnLogin").style.display = "block"
			}
		}
		main()
